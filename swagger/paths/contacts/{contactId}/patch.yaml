tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: Update an existing contact belonging to the authorized user.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
    description: The unique ID of the contact
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380501234567'
          email:
            description: "Contact's email"
            type: string
            example: 'john@example.com'
          isFavourite:
            description: 'Whether this contact is a favourite'
            type: boolean
            example: false
          contactType:
            description: 'Type of contact'
            type: string
            enum: [work, home, personal]
            example: personal
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    description: Unauthorized
  '404':
    description: Contact not found
