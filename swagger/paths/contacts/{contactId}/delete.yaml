#swagger\paths\contacts\{contactId}\delete.yaml
tags:
  - Contacts
summary: Delete a contact
operationId: deleteContact
description: Delete a contact belonging to the authorized user by its ID
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
    description: The unique ID of the contact
responses:
  '204':
    description: Successfully deleted contact
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Unauthorized
