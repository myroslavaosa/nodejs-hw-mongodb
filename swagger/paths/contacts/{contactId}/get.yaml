#swagger\paths\contacts\{contactId}\get.yaml
tags:
  - Contacts
summary: Get a contact by ID
operationId: getContactById
description: Retrieve a single contact belonging to the authorized user by its ID.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
    description: The unique ID of the contact
responses:
  '200':
    description: Successfully found contact
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact!
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
