# C:\projects\nodejs-hw-mongodb\swagger\components\schemas\contact.yaml
type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    type: string
    example: John Doe
  phoneNumber:
    type: string
    example: '+380501234567'
  email:
    type: string
    example: john@example.com
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum: [work, home, personal]
    example: personal
  photo:
    type: string
    example: https://res.cloudinary.com/yourcloud/image/upload/photo.png
  userId:
    type: string
    example: 65e4decdd286b30065d54af9
